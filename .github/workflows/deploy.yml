name: Deploy to Gabia

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/e1jeong/lotto-sub-backend
            git fetch origin master
            git reset --hard origin/master
            npm install --production=false
            npm run build
            pm2 restart lotto-sub-backend

      - name: Notify success
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TEXT=$(printf '✅ 배포 성공\n레포: %s\n커밋: %s\n로그: %s' \
            "${{ github.repository }}" "${GITHUB_SHA::7}" "$SUBJECT")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode text="$TEXT"

      - name: Notify failure
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TEXT=$(printf '❌ 배포 실패\n레포: %s\n커밋: %s\n로그: %s' \
            "${{ github.repository }}" "${GITHUB_SHA::7}" "$SUBJECT")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode text="$TEXT"
