name: Deploy to Gabia

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/e1jeong/lotto-sub-backend
            git pull origin master
            npm install --production=false
            npm run build
            pm2 restart lotto-backend

      - name: Notify success
        if: success()
        run: |
          curl -X POST ${{ secrets.N8N_DEPLOY_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{"status":"success","message":"배포 성공","repo":"${{ github.repository }}","commit":"${{ github.sha }}"}'

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.N8N_DEPLOY_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{"status":"failure","message":"배포 실패","repo":"${{ github.repository }}","commit":"${{ github.sha }}"}'
